name: Verify Legacy
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: resources/bin/win32-x64
          key: bin-${{ runner.os }}-${{ hashFiles('scripts/fetch-ffmpeg.mjs', 'scripts/fetch-cloudflared.mjs') }}
      - run: npm run fetch:ffmpeg
      - run: npm run fetch:cloudflared
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=2
      - run: npm run build
      - run: npx playwright test
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Legacy-${{ github.sha }}
          path: |
            dist/Legacy-Setup-*.exe
            dist/*.blockmap
            dist/latest.yml
            out/main/build-info.json
          retention-days: 14
